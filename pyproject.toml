[project]
name = "kitsunox"
version = "0.1.0"
description = "Detects source-level software supply chain attacks from git commits and pull requests"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "anthropic>=1.8.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=7.1.0",
    "responses>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kitsunox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
