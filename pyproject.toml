[project]
name = "kitsunox"
version = "0.1.0"
description = "AI-assisted workflow to detect software supply chain attacks in open source registries (npm first)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Tier 2 LLM layer — not used this pass.
llm = ["anthropic>=0.40"]
# Optional AST-based install-script analysis for Tier 0. Start regex-only.
ast = ["tree-sitter>=0.21", "tree-sitter-javascript>=0.21"]
dev = [
    "pytest>=8.2",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
kitsunox = "kitsunox.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kitsunox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: test hits real external services (run with -m network)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"kitsunox/db/migrations/*" = ["E501"]
"tests/*" = ["E501"]
